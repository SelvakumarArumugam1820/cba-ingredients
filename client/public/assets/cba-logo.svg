<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D696" />
      <stop offset="45%" stop-color="#C99A3D" />
      <stop offset="100%" stop-color="#9A7224" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193B5C" />
      <stop offset="100%" stop-color="#0A2036" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A2036" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean bright white background container with soft rounded corners -->
  <rect x="6" y="6" width="228" height="228" rx="48" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="6" y="6" width="228" height="228" rx="48" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.5"/>

  <!-- Premium Deep Navy Badge -->
  <circle cx="120" cy="112" r="82" fill="url(#navyGrad)"/>
  <circle cx="120" cy="112" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Geometric Emblem Marks: CBA Intertwined Monogram + Food Ingredient Crest -->
  <g transform="translate(120, 104)">
    <!-- Elegant Outer C Ring -->
    <path d="M 22 -34 A 38 38 0 1 0 22 34" fill="none" stroke="url(#goldGrad)" stroke-width="9" stroke-linecap="round"/>
    
    <!-- Central Leaf & Grain Wheat Motif -->
    <path d="M 0 -22 C 10 -10, 10 10, 0 22 C -10 10, -10 -10, 0 -22 Z" fill="url(#goldGrad)"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#0A2036" stroke-width="2" stroke-linecap="round"/>
    <path d="M -14 -6 C -4 -16, 4 -16, 14 -6" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -14 6 C -4 16, 4 16, 14 6" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="120" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Manrope', 'Inter', sans-serif" font-weight="800" font-size="21" letter-spacing="4" fill="#FFFFFF">CBA</text>
  <text x="120" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Manrope', 'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="3.5" fill="#112D4A">INGREDIENTS</text>
</svg>
